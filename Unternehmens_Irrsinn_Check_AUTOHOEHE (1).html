function has(ans,code){const q=Number(code.slice(0,-1))-1;return ans[q]===code.slice(-1)}
function scoreDiagnosis(d,ans){if(!d.trigger.every(c=>has(ans,c)))return null;const positive=d.support.filter(c=>has(ans,c)).length;const negative=d.against.filter(c=>has(ans,c)).length;const base=d.trigger.length>=3?10:8;return {...d,score:base+2*positive-3*negative,confirm:positive,counter:negative,matched:d.trigger.length+positive}}
function categorySeverities(ans){return Array.from({length:5},(_,i)=>DATA.questions.slice(i*2,i*2+2).reduce((s,q,j)=>s+q.severity[letters.indexOf(ans[i*2+j])],0))}
function fallback(ans){const sev=categorySeverities(ans),high=sev.filter(v=>v>=4).length,low=sev.filter(v=>v<=2).length;const positive=sev.filter(v=>v<=1).length;const spread=Math.max(...sev)-Math.min(...sev);if(high>=1&&low>=1&&spread>=3)return {id:27,title:'Die Unternehmens-Wundertüte',type:'mixed',score:5,action:'Vergleichen Sie zwei ähnliche Vorgänge: einen, der reibungslos lief, und einen, der im Chaos endete. Was war bei Zuständigkeiten, Übergaben und Informationen anders?',explain:'Mal läuft alles wie geschmiert, mal streut jemand Sand ins Getriebe. Ihre Antworten zeichnen ein wechselhaftes Bild – jeder Tag ein Griff in die Wundertüte. Das kann auf sehr unterschiedliche Bereiche oder stark situationsabhängige Abläufe hinweisen.'};return {id:28,title:'Der unauffällige Sonderling',type:positive>=3?'positive':'mixed',score:4,action:'Wählen Sie einen gut funktionierenden und einen weniger gut funktionierenden Arbeitsablauf. Vergleichen Sie, was konkret den Unterschied ausmacht.',explain:'Ihr Unternehmen weigert sich beharrlich, in unsere Irrsinn-Schubladen zu passen. Die Antworten ergeben keine ausreichend klare Kombination für eine spezifischere Diagnose. Das ist kein Befund über Ihre Persönlichkeit – nur eine Grenze dieses Kurztests.'}}
const suppress={14:[1,4,6,9,11],11:[6,7,8],21:[15,16],22:[17,18],4:[9],10:[7],2:[5]};
function overlap(a,b){const s=new Set([...(a.trigger||[]),...(a.support||[])]);return (b.trigger||[]).filter(c=>s.has(c)).length}
function distinctRanked(ranked){const chosen=[];for(const d of ranked){if(chosen.some(x=>((suppress[x.id]||[]).includes(d.id)&&overlap(x,d)>=1)))continue;chosen.push(d)}return chosen}
function analyze(ans){const matches=DATA.diagnoses.map(d=>scoreDiagnosis(d,ans)).filter(Boolean).sort((a,b)=>b.score-a.score||b.trigger.length-a.trigger.length||a.id-b.id);const ranked=distinctRanked(matches);const first=ranked.find(d=>d.score>=8)||fallback(ans);let second=ranked.find(d=>d.id!==first.id&&d.score>=5&&((d.type!==first.type&&overlap(first,d)<=1)||overlap(first,d)===0));if(!second&&first.id<27){second=ranked.find(d=>d.id!==first.id&&d.score>=5&&overlap(first,d)<=1)}const sev=categorySeverities(ans);const index=Math.round(sev.reduce((a,b)=>a+b,0)/30*100);return {first,second:second||null,index,category:sev,matches:matches.length,matchedIds:matches.map(d=>d.id),fallback:first.id>=27}}
function perspective(action){const role=state.context[0];if(role===0)return 'Aus Ihrer Perspektive: Sammeln Sie ein konkretes Beispiel und sprechen Sie es bei der zuständigen Person an. '+action;if(role===1)return 'Aus Ihrer Koordinationsperspektive: Probieren Sie die Maßnahme zunächst in einem überschaubaren Vorgang aus. '+action;if(role===2)return 'Aus Ihrer Bereichsperspektive: Testen Sie die Maßnahme in einem verantworteten Ablauf. '+action;return 'Aus Sicht der Unternehmensführung: Lassen Sie die Praxis zuerst sichtbar werden, bevor Sie Vorgaben ändern. '+action}
function draw(){const step=state.step;const total=13;let html='<section class="ic-shell"><header class="ic-head"><h2>Wie irre ist Ihr Unternehmen?</h2><p>Der Irrsinn-Check. 10 Fragen, 5 Themenfelder – und möglicherweise ein paar unangenehm treffende Erkenntnisse.</p></header>';
if(step<total){const isContext=step<3;const i=isContext?step:step-3;const q=isContext?contextQuestions[i]:DATA.questions[i];const selected=isContext?state.context[i]:state.answers[i];html+='<div class="ic-progress"><div style="width:'+Math.round(step/total*100)+'%"></div></div><main class="ic-body"><div class="ic-kicker">'+(isContext?'Zur Einordnung · '+(step+1)+'/3':'Frage '+(i+1)+'/10 · '+escapeHTML(q.category))+'</div><h3>'+escapeHTML(q.title||q.text)+'</h3><div role="radiogroup" aria-label="Antwortmöglichkeiten">';q.options.forEach((o,j)=>{const val=isContext?String(j):letters[j];const checked=selected=== (isContext?j:val);html+='<label class="ic-opt"><input type="radio" name="ic-answer" value="'+escapeHTML(val)+'" '+(checked?'checked':'')+'><span>'+(isContext?'':'<b>'+letters[j]+'.</b>')+escapeHTML(o)+'</span></label>'});html+='</div><div class="ic-nav"><button type="button" class="ic-secondary" data-action="back" '+(step===0?'disabled':'')+'>Zurück</button><span class="ic-muted">'+(step+1)+' / '+total+'</span><button type="button" data-action="next" '+(selected===null?'disabled':'')+'>'+(step===12?'Auswertung anzeigen':'Weiter')+'</button></div><p class="ic-footer">Die Antworten werden in dieser Version ausschließlich im Browser ausgewertet und nicht an einen Server gesendet.</p></main>'}
else{const r=state.result||analyze(state.answers);state.result=r;const label=r.index<25?'Erstaunlich wenig Irrsinn':r.index<50?'Leichte bis mittlere Turbulenzen':r.index<75?'Deutliches Irrsinn-Potenzial':'Fortgeschrittener Unternehmensirrsinn';html+='<main class="ic-body"><div class="ic-kicker">Ihre Auswertung</div><div class="ic-score">'+r.index+' / 100</div><p><b>'+label+'</b></p><p class="ic-muted">Der Index ist ein spielerischer Orientierungswert, kein wissenschaftlich validiertes Messinstrument.</p><div class="ic-divider"></div><div class="ic-badge">Wichtigste Erkenntnis</div><h3>'+escapeHTML(r.first.title)+'</h3><p>'+escapeHTML(r.first.explain||explain(r.first))+'</p><div class="ic-panel"><b>Ihr Irrsinn-Killer</b><p>'+escapeHTML(perspective(r.first.action))+'</p><p class="ic-small"><b>Wirksamkeitscheck:</b> Vergleichen Sie den Ablauf vor und nach der Maßnahme anhand eines konkreten Beispiels – etwa Zeitaufwand, Rückfragen oder Übergaben.</p></div>';if(r.second){html+='<div class="ic-divider"></div><div class="ic-badge">Zweite Seite der Medaille</div><h3>'+escapeHTML(r.second.title)+'</h3><p>'+escapeHTML(explain(r.second))+'</p><p><b>Ein Ansatz:</b> '+escapeHTML(r.second.action)+'</p>'}else{html+='<div class="ic-panel"><b>Keine zweite Diagnose auf Verdacht.</b><p>Für eine weitere unabhängige Aussage reicht dieses Antwortmuster nicht aus. Lieber eine treffende Erkenntnis als drei erfundene.</p></div>'}html+='<p class="ic-footer">Grundlage: Ihre Selbsteinschätzung. Zusammenhänge sind Hypothesen, keine nachgewiesenen Ursachen. Die Antworten werden nicht gespeichert. Keine personenbezogene Diagnose.</p><div class="ic-nav"><button type="button" class="ic-secondary" data-action="back">Antworten prüfen</button><button type="button" data-action="restart">Neu starten</button></div></main>'}root.innerHTML=html+'</section>'}
function explain(d){const descriptions={1:'Abstimmungen und Hierarchien könnten Entscheidungen verzögern. Vielleicht liegt das Problem weniger in den Meetings als darin, wer entscheiden darf.',2:'Jeder erledigt seinen Teil. Das Gesamtergebnis scheint dabei gelegentlich auf der Strecke zu bleiben.',3:'Verbesserungsideen versanden möglicherweise, weil operative Erfahrungen bei der Steuerung zu wenig Beachtung finden.',4:'Besprechungen erzeugen offenbar neue Besprechungen. Die eigentliche Arbeit wartet geduldig draußen.',5:'Es wird besprochen und verteilt, aber die Verantwortung für den Abschluss bleibt möglicherweise unklar.',6:'Vielleicht hat Ihr Unternehmen nicht die Bürokratie abgeschafft, sondern sie nur erfolgreich digitalisiert.',7:'Verteilte Informationsstände und holprige Übergaben könnten auf fehlende gemeinsame Informationsstandards hinweisen.',8:'Persönliche Kontakte und Improvisation halten womöglich Prozesse am Laufen, die auf dem Papier ganz anders aussehen.',9:'Nachrichten und Meetings könnten sich gegenseitig vermehren – ein Kommunikationstsunami mit Kalenderzugriff.',10:'Informelle Eigenlösungen und unterschiedlich geregelte Übergaben könnten den Gesamtprozess destabilisieren.',11:'Oben leuchten die Prozessampeln grün. Unten wird möglicherweise mit Excel, Telefon und Geduld nachgeholfen.',12:'Wenn Schuldabwehr wichtiger wird als Problemlösung, können Fehler und Konflikte sich gegenseitig verstärken.',13:'Ergebnisdruck und digitale Nebentätigkeiten könnten die Stimmung belasten, obwohl die Kennzahlen stimmen.',14:'Hierarchien, Meetings und Freigaben könnten sich gegenseitig antreiben. Ein erstaunlich gut organisiertes Hindernisrennen.',15:'Entscheidungen und Besprechungen führen zu Ergebnissen. Das ist keine Selbstverständlichkeit – und eine Stärke, die sich übertragen lässt.',16:'Trotz kleiner Schnittstellenprobleme werden Kundenfälle zu Ende gebracht. Offenbar übernimmt jemand wirksam Verantwortung.',17:'Die Zusammenarbeit funktioniert trotz lästiger digitaler Vorgaben. Der Teamgeist ist womöglich besser als die Prozesse.',18:'Ein funktionierendes persönliches Netzwerk kompensiert die schlechte Auffindbarkeit von Informationen. Gut für heute, riskant im Urlaub.',19:'Die Meetings bringen Ergebnisse, sind aber zu zahlreich. Weniger davon könnte denselben Nutzen mit geringerem Aufwand liefern.',20:'Die Arbeit macht trotz organisatorischer Schwierigkeiten Freude. Eine Stärke, die bei jeder Veränderung geschützt werden sollte.',21:'Entscheidungen, Abstimmungen und Übergaben greifen gut ineinander. Offenbar funktioniert Selbstorganisation tatsächlich.',22:'Digitale Systeme unterstützen die Arbeit, und Informationen sind auffindbar. So war Digitalisierung ursprünglich einmal gedacht.',23:'Die Stimmung ist gut, doch Erfolge anderer werden nicht immer offen anerkannt. Das kann nebeneinander bestehen.',24:'Die Führung kennt die Abläufe, aber an Schnittstellen hakt es trotzdem. Erkenntnis allein löst noch kein Problem.',25:'Entscheidungen funktionieren, aber Abteilungsgrenzen bremsen. Eine schnelle Insel macht noch keinen schnellen Gesamtprozess.',26:'Die Arbeit macht Spaß, obwohl digitale Pflichtschritte nerven. Gute Stimmung und Bürokratie schließen sich leider nicht aus.'};return descriptions[d.id]||''}
